<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Getty Images Metadata Tool (OpenAI)</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="app-container">
        <!-- Header -->
        <header class="header">
            <h1>Getty Images Metadata Tool</h1>
            <button id="settingsBtn" class="icon-btn" aria-label="Settings">⚙️</button>
        </header>

        <!-- Settings Modal -->
        <div id="settingsModal" class="modal hidden">
            <div class="modal-content">
                <div class="modal-header">
                    <h2>Settings</h2>
                    <button id="closeSettingsBtn" class="close-btn">&times;</button>
                </div>
                <div class="modal-body">
                    <div class="form-group">
                        <label for="apiKeyInput">OpenAI API Key:</label>
                        <input type="password" id="apiKeyInput" placeholder="Enter your API key">
                        <small>Get your API key at <a href="https://platform.openai.com/api-keys" target="_blank">OpenAI Platform</a> (GPT-4o-mini ~$0.001/image)</small>
                    </div>
                    <button id="saveApiKeyBtn" class="btn btn-primary">Save API Key</button>
                    <div id="apiKeyStatus" class="status-message"></div>
                </div>
            </div>
        </div>

        <!-- Main Content -->
        <main class="main-content">
            <!-- API Key Warning -->
            <div id="apiKeyWarning" class="warning-banner hidden">
                <p>⚠️ Please set your OpenAI API key in settings to use this app.</p>
            </div>

            <!-- Upload Section -->
            <section class="upload-section">
                <div class="upload-area" id="uploadArea">
                    <input type="file" id="fileInput" accept="image/*" multiple hidden>
                    <div class="upload-content">
                        <div class="upload-icon">📷</div>
                        <p class="upload-text">Tap to upload images</p>
                        <p class="upload-hint">Supports JPG, PNG, WebP</p>
                    </div>
                </div>
            </section>

            <!-- Images Grid -->
            <section class="images-section" id="imagesSection">
                <div class="section-header">
                    <h2>Images (<span id="imageCount">0</span>)</h2>
                    <div class="action-buttons">
                        <button id="generateAllBtn" class="btn btn-secondary" disabled>
                            Generate All Metadata
                        </button>
                        <button id="exportBtn" class="btn btn-primary" disabled>
                            Export
                        </button>
                    </div>
                </div>
                <div id="imagesGrid" class="images-grid">
                    <!-- Image cards will be inserted here -->
                </div>
            </section>
        </main>

        <!-- Export Modal -->
        <div id="exportModal" class="modal hidden">
            <div class="modal-content">
                <div class="modal-header">
                    <h2>Export Metadata</h2>
                    <button id="closeExportBtn" class="close-btn">&times;</button>
                </div>
                <div class="modal-body">
                    <p>Choose export format:</p>
                    <div class="export-buttons">
                        <button id="exportCsvBtn" class="btn btn-primary">
                            📄 Export as CSV
                        </button>
                        <button id="exportJsonBtn" class="btn btn-primary">
                            📋 Export as JSON
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Loading Overlay -->
        <div id="loadingOverlay" class="loading-overlay hidden">
            <div class="spinner"></div>
            <p id="loadingText">Processing...</p>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
